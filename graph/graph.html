<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Wiki Knowledge Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #header {
    background: #16213e;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #0f3460;
    z-index: 10;
    position: relative;
  }
  #header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #e0e0e0;
  }
  #header .stats {
    font-size: 13px;
    color: #a0a0b0;
  }
  #controls {
    background: #16213e;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #0f3460;
    z-index: 10;
    position: relative;
  }
  #search-box {
    padding: 6px 12px;
    border: 1px solid #0f3460;
    border-radius: 4px;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 14px;
    width: 280px;
    outline: none;
  }
  #search-box:focus { border-color: #533483; }
  #search-box::placeholder { color: #666680; }
  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 13px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  #graph-container {
    width: 100%;
    height: calc(100vh - 90px);
  }
  #inspector {
    position: fixed;
    top: 90px;
    right: 0;
    width: 320px;
    background: #16213e;
    border-left: 1px solid #0f3460;
    padding: 20px;
    height: calc(100vh - 90px);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 20;
  }
  #inspector.open { transform: translateX(0); }
  #inspector h2 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #fff;
    word-wrap: break-word;
  }
  #inspector .field {
    margin-bottom: 10px;
  }
  #inspector .field-label {
    font-size: 11px;
    text-transform: uppercase;
    color: #777790;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  #inspector .field-value {
    font-size: 14px;
    color: #c0c0d0;
  }
  #inspector .type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  #inspector .connections-list {
    list-style: none;
    padding: 0;
  }
  #inspector .connections-list li {
    padding: 4px 0;
    font-size: 13px;
    color: #a0a0b0;
    cursor: pointer;
  }
  #inspector .connections-list li:hover {
    color: #fff;
  }
  #inspector .close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: #777790;
    font-size: 20px;
    cursor: pointer;
  }
  #inspector .close-btn:hover { color: #fff; }
  .search-count {
    font-size: 12px;
    color: #777790;
  }
</style>
</head>
<body>

<div id="header">
  <h1>LLM Wiki Knowledge Graph</h1>
  <div class="stats" id="stats"></div>
</div>

<div id="controls">
  <input type="text" id="search-box" placeholder="Search nodes..." />
  <span class="search-count" id="search-count"></span>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#4CAF50"></span> Source</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2196F3"></span> Entity</div>
    <div class="legend-item"><span class="legend-dot" style="background:#FF9800"></span> Concept</div>
    <div class="legend-item"><span class="legend-dot" style="background:#9C27B0"></span> Synthesis</div>
  </div>
</div>

<div id="graph-container"></div>

<div id="inspector">
  <button class="close-btn" onclick="closeInspector()">&times;</button>
  <div id="inspector-content"></div>
</div>

<script>
// --- Graph Data ---
const graphData = {
  "nodes": [
    { "id": "bubble-sort", "label": "Bubble Sort Visualization", "type": "source", "file": "wiki/sources/bubble-sort.md" },
    { "id": "trees", "label": "Binary Tree Traversals", "type": "source", "file": "wiki/sources/trees.md" },
    { "id": "linked-list", "label": "Linked List Implementation", "type": "source", "file": "wiki/sources/linked-list.md" },
    { "id": "oop-inheritance", "label": "OOP Inheritance \u2014 Animal Kingdom", "type": "source", "file": "wiki/sources/oop-inheritance.md" },
    { "id": "oop-game", "label": "OOP Space Adventure Game", "type": "source", "file": "wiki/sources/oop-game.md" },
    { "id": "oop-flash-cards", "label": "OOP Flash Cards Drill", "type": "source", "file": "wiki/sources/oop-flash-cards.md" },
    { "id": "oop-basics", "label": "OOP Basics \u2014 Song Class", "type": "source", "file": "wiki/sources/oop-basics.md" },
    { "id": "abstraction-todo", "label": "Abstraction Todo \u2014 Journal App Design", "type": "source", "file": "wiki/sources/abstraction-todo.md" },
    { "id": "BubbleSort", "label": "Bubble Sort", "type": "concept", "file": "wiki/concepts/BubbleSort.md" },
    { "id": "BinaryTree", "label": "Binary Tree", "type": "concept", "file": "wiki/concepts/BinaryTree.md" },
    { "id": "LinkedList", "label": "Linked List", "type": "concept", "file": "wiki/concepts/LinkedList.md" },
    { "id": "Inheritance", "label": "Inheritance", "type": "concept", "file": "wiki/concepts/Inheritance.md" },
    { "id": "ObjectOrientedProgramming", "label": "Object-Oriented Programming", "type": "concept", "file": "wiki/concepts/ObjectOrientedProgramming.md" },
    { "id": "Recursion", "label": "Recursion", "type": "concept", "file": "wiki/concepts/Recursion.md" },
    { "id": "data-structures-studied", "label": "What data structures have I studied?", "type": "synthesis", "file": "wiki/syntheses/data-structures-studied.md" },
    { "id": "overview", "label": "Overview", "type": "synthesis", "file": "wiki/overview.md" }
  ],
  "edges": [
    { "from": "overview", "to": "LinkedList", "type": "EXTRACTED" },
    { "from": "overview", "to": "linked-list", "type": "EXTRACTED" },
    { "from": "overview", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "overview", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "overview", "to": "trees", "type": "EXTRACTED" },
    { "from": "overview", "to": "BubbleSort", "type": "EXTRACTED" },
    { "from": "overview", "to": "bubble-sort", "type": "EXTRACTED" },
    { "from": "overview", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "overview", "to": "Inheritance", "type": "EXTRACTED" },
    { "from": "overview", "to": "abstraction-todo", "type": "EXTRACTED" },
    { "from": "overview", "to": "oop-basics", "type": "EXTRACTED" },
    { "from": "overview", "to": "oop-flash-cards", "type": "EXTRACTED" },
    { "from": "overview", "to": "oop-inheritance", "type": "EXTRACTED" },
    { "from": "overview", "to": "oop-game", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "LinkedList", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "linked-list", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "trees", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "data-structures-studied", "to": "bubble-sort", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "oop-basics", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "bubble-sort", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "trees", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "linked-list", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "oop-inheritance", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "oop-game", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "oop-flash-cards", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "abstraction-todo", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "Inheritance", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "BubbleSort", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "LinkedList", "type": "EXTRACTED" },
    { "from": "ObjectOrientedProgramming", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "BubbleSort", "to": "bubble-sort", "type": "EXTRACTED" },
    { "from": "BubbleSort", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "BinaryTree", "to": "trees", "type": "EXTRACTED" },
    { "from": "BinaryTree", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "BinaryTree", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "LinkedList", "to": "linked-list", "type": "EXTRACTED" },
    { "from": "LinkedList", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "LinkedList", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "Inheritance", "to": "oop-inheritance", "type": "EXTRACTED" },
    { "from": "Inheritance", "to": "oop-game", "type": "EXTRACTED" },
    { "from": "Inheritance", "to": "abstraction-todo", "type": "EXTRACTED" },
    { "from": "Inheritance", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "Recursion", "to": "trees", "type": "EXTRACTED" },
    { "from": "Recursion", "to": "oop-game", "type": "EXTRACTED" },
    { "from": "Recursion", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "bubble-sort", "to": "BubbleSort", "type": "EXTRACTED" },
    { "from": "bubble-sort", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "trees", "to": "BinaryTree", "type": "EXTRACTED" },
    { "from": "trees", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "trees", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "linked-list", "to": "LinkedList", "type": "EXTRACTED" },
    { "from": "linked-list", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "oop-inheritance", "to": "Inheritance", "type": "EXTRACTED" },
    { "from": "oop-inheritance", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "oop-game", "to": "Inheritance", "type": "EXTRACTED" },
    { "from": "oop-game", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "oop-game", "to": "Recursion", "type": "EXTRACTED" },
    { "from": "oop-flash-cards", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "oop-basics", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" },
    { "from": "abstraction-todo", "to": "Inheritance", "type": "EXTRACTED" },
    { "from": "abstraction-todo", "to": "ObjectOrientedProgramming", "type": "EXTRACTED" }
  ]
};

// --- Color Map ---
const colorMap = {
  source: "#4CAF50",
  entity: "#2196F3",
  concept: "#FF9800",
  synthesis: "#9C27B0"
};

// --- Build vis.js datasets ---
const nodeMap = {};
graphData.nodes.forEach(n => { nodeMap[n.id] = n; });

const visNodes = new vis.DataSet(graphData.nodes.map(n => ({
  id: n.id,
  label: n.label,
  color: {
    background: colorMap[n.type] || "#888",
    border: colorMap[n.type] || "#888",
    highlight: { background: lighten(colorMap[n.type] || "#888"), border: "#fff" },
    hover: { background: lighten(colorMap[n.type] || "#888"), border: "#fff" }
  },
  font: { color: "#e0e0e0", size: 13, face: "Segoe UI, sans-serif" },
  shape: "dot",
  size: 12 + getEdgeCount(n.id) * 1.5,
  borderWidth: 2,
  shadow: { enabled: true, color: "rgba(0,0,0,0.4)", size: 6 },
  _type: n.type,
  _file: n.file
})));

const visEdges = new vis.DataSet(graphData.edges.map((e, i) => ({
  id: "e" + i,
  from: e.from,
  to: e.to,
  color: { color: "#555555", highlight: "#aaa", hover: "#888" },
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
  smooth: { type: "continuous" },
  width: 1.2
})));

function getEdgeCount(nodeId) {
  return graphData.edges.filter(e => e.from === nodeId || e.to === nodeId).length;
}

function lighten(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return "rgb(" + Math.min(255, r+50) + "," + Math.min(255, g+50) + "," + Math.min(255, b+50) + ")";
}

// --- Stats ---
document.getElementById("stats").textContent =
  graphData.nodes.length + " nodes | " + graphData.edges.length + " edges | Generated 2026-04-09";

// --- Init Network ---
const container = document.getElementById("graph-container");
const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
  physics: {
    forceAtlas2Based: {
      gravitationalConstant: -40,
      centralGravity: 0.005,
      springLength: 160,
      springConstant: 0.04,
      damping: 0.4
    },
    solver: "forceAtlas2Based",
    stabilization: { iterations: 200 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    navigationButtons: false,
    keyboard: false
  },
  layout: { improvedLayout: true }
});

// --- Search ---
const searchBox = document.getElementById("search-box");
const searchCount = document.getElementById("search-count");
let allNodeIds = graphData.nodes.map(n => n.id);

searchBox.addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    // Reset all nodes to full opacity
    visNodes.update(allNodeIds.map(id => ({
      id,
      opacity: 1.0,
      font: { color: "#e0e0e0", size: 13, face: "Segoe UI, sans-serif" }
    })));
    visEdges.update(graphData.edges.map((e, i) => ({
      id: "e" + i,
      color: { color: "#555555", highlight: "#aaa", hover: "#888" },
      width: 1.2
    })));
    searchCount.textContent = "";
    return;
  }

  const matched = new Set();
  graphData.nodes.forEach(n => {
    if (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || n.type.toLowerCase().includes(q)) {
      matched.add(n.id);
    }
  });

  // Dim non-matching nodes
  visNodes.update(allNodeIds.map(id => {
    if (matched.has(id)) {
      return { id, opacity: 1.0, font: { color: "#fff", size: 14, face: "Segoe UI, sans-serif", bold: true } };
    } else {
      return { id, opacity: 0.15, font: { color: "rgba(224,224,224,0.2)", size: 13, face: "Segoe UI, sans-serif" } };
    }
  }));

  // Dim edges not connected to matched nodes
  visEdges.update(graphData.edges.map((e, i) => {
    if (matched.has(e.from) || matched.has(e.to)) {
      return { id: "e" + i, color: { color: "#555555" }, width: 1.2 };
    } else {
      return { id: "e" + i, color: { color: "rgba(85,85,85,0.1)" }, width: 0.5 };
    }
  }));

  searchCount.textContent = matched.size + " match" + (matched.size !== 1 ? "es" : "");
});

// --- Inspector ---
const inspector = document.getElementById("inspector");
const inspectorContent = document.getElementById("inspector-content");

network.on("click", function(params) {
  if (params.nodes.length > 0) {
    showInspector(params.nodes[0]);
  } else {
    closeInspector();
  }
});

function showInspector(nodeId) {
  const node = nodeMap[nodeId];
  if (!node) return;

  const inbound = graphData.edges.filter(e => e.to === nodeId).map(e => e.from);
  const outbound = graphData.edges.filter(e => e.from === nodeId).map(e => e.to);
  const typeColor = colorMap[node.type] || "#888";

  let html = "";
  html += "<h2>" + escapeHtml(node.label) + "</h2>";
  html += '<div class="field"><div class="field-label">Type</div>';
  html += '<div class="field-value"><span class="type-badge" style="background:' + typeColor + '">' + node.type + '</span></div></div>';
  html += '<div class="field"><div class="field-label">ID</div>';
  html += '<div class="field-value" style="font-family:monospace;font-size:12px">' + escapeHtml(node.id) + '</div></div>';
  html += '<div class="field"><div class="field-label">File</div>';
  html += '<div class="field-value" style="font-family:monospace;font-size:12px">' + escapeHtml(node.file) + '</div></div>';
  html += '<div class="field"><div class="field-label">Connections</div>';
  html += '<div class="field-value">' + (inbound.length + outbound.length) + ' total (' + inbound.length + ' in, ' + outbound.length + ' out)</div></div>';

  if (outbound.length > 0) {
    html += '<div class="field"><div class="field-label">Links To (' + outbound.length + ')</div><ul class="connections-list">';
    outbound.forEach(id => {
      const target = nodeMap[id];
      const label = target ? target.label : id;
      html += '<li onclick="focusNode(\'' + escapeHtml(id) + '\')">&rarr; ' + escapeHtml(label) + '</li>';
    });
    html += '</ul></div>';
  }

  if (inbound.length > 0) {
    html += '<div class="field"><div class="field-label">Linked From (' + inbound.length + ')</div><ul class="connections-list">';
    inbound.forEach(id => {
      const src = nodeMap[id];
      const label = src ? src.label : id;
      html += '<li onclick="focusNode(\'' + escapeHtml(id) + '\')">&larr; ' + escapeHtml(label) + '</li>';
    });
    html += '</ul></div>';
  }

  inspectorContent.innerHTML = html;
  inspector.classList.add("open");
}

function closeInspector() {
  inspector.classList.remove("open");
}

function focusNode(nodeId) {
  network.selectNodes([nodeId]);
  network.focus(nodeId, { scale: 1.2, animation: { duration: 500, easingFunction: "easeInOutQuad" } });
  showInspector(nodeId);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
